name = "researchroomies"
main = "src/index.ts"
compatibility_date = "2025-08-26"

account_id = "3cec30fdcb5e689c159089dc6772ae0b"

[vars]
# Optional institutional-email gate on login/signup. Off by default.
# Set to "true" and redeploy to accept only addresses ending in .edu.
# Read the tradeoff note in CLAUDE.md before enabling: a strict .edu suffix
# also turns away international academics (.ac.uk, .edu.au, and universities
# with no .edu domain at all), and it applies to EXISTING users too, so anyone
# already registered with a non-.edu address loses the ability to log in.
RESTRICT_EDU_EMAILS = "false"

# public turnstile key
TURNSTILE_SITE_KEY = "0x4AAAAAAByAHmDummOs9UGm"

[observability]
enabled = true

[assets]
directory = "./public/"
not_found_handling = "404-page"
binding = "ASSETS"
# Static assets are matched BEFORE the Worker runs, so any path that must reach
# a Worker route has to either have no matching asset or be listed here.
# /search regressed exactly this way: templates/pages/search.njk built to
# public/search/index.html and silently shadowed the GET /search handler.
#
# This list must cover every route in src/routes.ts. /conference/*, /subject/*
# and /post/* were missing and worked only because no Eleventy template happened
# to build to those paths. test/assets.test.ts now checks the two directions:
# that nothing in public/ shadows a route, and that every route is claimed here.
#
# Rules are anchored at both ends and "*" expands to ".*", so it matches across
# "/" — "/post/*" covers "/post/1/edit" as well as "/post/1". A rule ending in
# "*" also makes any other rule sharing its prefix an error, so do not add
# narrower entries alongside these.
run_worker_first = [
  "/api/*",
  "/search",
  "/my-posts",
  "/conference/*",
  "/subject/*",
  "/post/*",
]

[[routes]]
pattern = "researchroomies.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "research-roomies"
database_id = "5469b98f-87d2-45d2-8e3d-738e45c1e3f2"
# Schema changes go in migrations/, never in an edited-and-re-run seed file.
# `wrangler d1 migrations apply research-roomies --local|--remote` runs the
# unapplied ones in order and records them in `d1_migrations`. This is wrangler's
# default directory; it is written out so the convention is visible in config.
migrations_dir = "migrations"